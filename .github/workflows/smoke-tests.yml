name: Testes do leitor x86
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/FMRTE2008.SmokeTests/FMRTE2008.SmokeTests.csproj --configuration Release
