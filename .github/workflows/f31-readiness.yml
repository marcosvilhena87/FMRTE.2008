name: F31 offline mapping readiness
on:
  pull_request:
    paths:
      - "evidence/f31/**"
      - "tools/f31/**"
      - "docs/F31_*.md"
      - ".github/workflows/f31-readiness.yml"
  push:
    paths:
      - "evidence/f31/**"
      - "tools/f31/**"
      - "docs/F31_*.md"
      - ".github/workflows/f31-readiness.yml"
permissions:
  contents: read
jobs:
  f31-offline-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate F31 traceability and mandatory gates (30 negative cases)
        run: |
          set -euo pipefail
          python3 tools/f31/validate_readiness.py --self-test --report "$RUNNER_TEMP/f31-report.json"
          python3 tools/f31/validate_readiness.py --self-test --report "$RUNNER_TEMP/f31-repeat.json"
          cmp "$RUNNER_TEMP/f31-report.json" "$RUNNER_TEMP/f31-repeat.json"
          python3 - "$RUNNER_TEMP/f31-report.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x["result"]=="PASS" and x["criteria"]==12 and x["risks"]==8
          assert x["negativeTests"]==30 and len(x["negativeNames"])==30
          assert x["operational"] is False and x["humanDecision"]=="NOT_MADE"
          assert x["wpfMode"]=="OFFLINE_ONLY"
          PY
      - name: Publish F31 offline readiness report
        uses: actions/upload-artifact@v4
        with:
          name: f31-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f31-report.json
          if-no-files-found: error
          retention-days: 30
