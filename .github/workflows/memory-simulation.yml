name: Simulacao de memoria x86
on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  memory-simulation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar e executar testes com memoria simulada
        run: dotnet run --project tests/FMRTE2008.MemorySimulation/FMRTE2008.MemorySimulation.csproj --configuration Release
        env:
          F20_GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar validador JSON Schema independente F22
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: F22 - validar contrato JSON Schema e mutacoes do C#
        run: python tests/FMRTE2008.MemorySimulation/F22IndependentSchemaValidation.py
      - name: F23.1 - validar proveniencia B03 em JSON Schema independente
        run: python tests/FMRTE2008.MemorySimulation/F23IndependentSchemaValidation.py
      - name: F23.2 - validar rastreabilidade de riscos em JSON Schema independente
        run: python tests/FMRTE2008.MemorySimulation/F23ResidualRiskIndependentSchemaValidation.py
      - name: F23.3 - validar decisão humana não realizada no esquema independente
        run: python tests/FMRTE2008.MemorySimulation/F23HumanDecisionIndependentSchemaValidation.py
      - name: F16 - robustez de handles Windows locais sem fm.exe
        run: dotnet run --project tests/FMRTE2008.WindowsResilience/FMRTE2008.WindowsResilience.csproj --configuration Release
      - name: Publicar evidencias F20 com digest independente do Git
        id: f20-artifact
        uses: actions/upload-artifact@v4
        with:
          name: f20-evidence-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f20-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Registrar digest do artefato imutavel no log
        run: echo "F20 GitHub artifact SHA-256 = ${{ steps.f20-artifact.outputs.artifact-digest }}"
